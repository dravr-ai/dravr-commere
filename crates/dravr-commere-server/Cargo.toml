# ABOUTME: Unified REST API + MCP server for dravr-commere notification service
# ABOUTME: Exposes notification operations via HTTP endpoints and MCP protocol
#
# SPDX-License-Identifier: MIT OR Apache-2.0
# Copyright (c) 2026 dravr.ai

[package]
name = "dravr-commere-server"
version = "0.0.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Unified REST API + MCP server for dravr-commere push notification service"
repository = "https://github.com/dravr-ai/dravr-commere"
readme = "README.md"
keywords = ["notifications", "push", "rest", "mcp", "server"]
categories = ["web-programming::http-server", "asynchronous"]
publish = false

[lib]
name = "dravr_commere_server"
path = "src/lib.rs"

[[bin]]
name = "dravr-commere-server"
path = "src/main.rs"

[dependencies]
dravr-commere = { path = "../..", version = "0.0.0" }
dravr-commere-mcp = { path = "../dravr-commere-mcp", version = "0.0.0" }
async-trait = "0.1"
axum = "0.8"
clap = { version = "4", features = ["derive"] }
futures = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
http-body-util = "0.1"
tokio = { version = "1", features = ["full", "test-util"] }
tower = { version = "0.5", features = ["util"] }

[lints]
workspace = true
